name: DNS Local - CI final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Validar Kotlin, Android e gerar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar ferramentas e SDK Android
        shell: bash
        run: |
          set -euo pipefail
          java -version
          kotlinc -version
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
          test -f "${ANDROID_HOME}/build-tools/36.0.0/aapt"
          echo "Android API 36 e build-tools 36 disponíveis"

      - name: Verificações estáticas Android
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-android-structure.py
          python3 tools/test-vpn-startup-structure.py

      - name: Testes Kotlin/JVM de DNS, filtro e TCP
        shell: bash
        run: |
          set -euo pipefail
          sh tools/test-blocklist-core.sh
          sh tools/test-filter-pipeline.sh
          sh tools/test-dns-core.sh
          sh tools/test-tcp-packet-core.sh
          sh tools/test-tcp-framing.sh
          sh tools/test-tcp-session.sh
          sh tools/test-tcp-tunnel.sh

      - name: Validar Android Lint e compilar APK debug sem publicação
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Exibir relatório Android Lint se houver falha
        if: failure()
        shell: bash
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "Relatório Lint indisponível nesta execução."
          fi

      - name: Arquivar relatório do Android Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-local-android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Arquivar APK somente para testes autorizados
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dns-local-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
